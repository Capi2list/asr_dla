defaults:
  - model: deepspeech
  - metrics: inference_metrics
  - datasets: custom_dataset_test
  - dataloader: eval
  - transforms: transforms_only_instance
  - _self_
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
inferencer:
  device_tensors: ["spectrogram", "text_encoded"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  save_path: "hii" # any name here, can be a dataset name
  seed: 1
  from_pretrained: "data/run_heavy_light/checkpoint-epoch50.pth" # path to the pretrained model
  decoder: "beam_search"

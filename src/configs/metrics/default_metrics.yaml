train: [] # metrics that are calculated during training
inference: # metrics that are calculated during inference (eval)
  - _target_: src.metrics.CERMetric
    name: "CER_(Argmax)" # it is better to avoid spaces in names
    decoder: "argmax"
  - _target_: src.metrics.WERMetric
    name: "WER_(Argmax)"
    decoder: "argmax"
  - _target_: src.metrics.CERMetric
    name: "CER_(beam_search)" # it is better to avoid spaces in names
    decoder: "beam_search"
  - _target_: src.metrics.WERMetric
    name: "WER_(beam_search)"
    decoder: "beam_search"
